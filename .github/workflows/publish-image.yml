name: Publicar imagens Docker (GHCR)

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  app-worker:
    name: Publicar ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: ghcr.io/weslleymouradev/lowzicrm
            dockerfile: Dockerfile
          - name: worker
            image: ghcr.io/weslleymouradev/lowzicrm-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  waha-legacy-cpu:
    name: Publicar WAHA compatível com CPU x86 antiga
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.waha-compat
          platforms: linux/amd64
          push: true
          tags: ghcr.io/weslleymouradev/lowzicrm-waha:2026.6.2-compat
          cache-from: type=gha,scope=waha-compat
          cache-to: type=gha,mode=max,scope=waha-compat
